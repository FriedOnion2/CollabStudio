<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CollabStudio · Antigravity × Claude × Codex</title>
  <link rel="icon" type="image/png" href="/icon.png" />
  <link rel="stylesheet" href="/styles.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <img src="/icon.png" alt="CollabStudio" class="brand-logo" />
        <div>
          <div class="brand-title">CollabStudio</div>
          <div class="brand-sub">AGY × Claude × Codex</div>
        </div>
      </div>

      <div class="sidebar-actions">
        <button id="btnNewProject" class="btn btn-primary full">+ 新建 / 导入项目</button>
      </div>

      <div class="section-label">项目列表</div>
      <div id="projectList" class="project-list"></div>

      <div class="sidebar-footer">
        <span class="conn-dot" id="connDot"></span>
        <span id="connText">本地服务已连接</span>
        <button id="btnQuit" class="btn-link" title="关闭后台服务">退出</button>
      </div>
    </aside>

    <main class="workspace">
      <div id="emptyState" class="empty-state">
        <div class="empty-card">
          <img src="/icon.png" alt="CollabStudio" class="empty-logo" />
          <h2>三端 AI 协作控制台</h2>
          <p><strong>Antigravity (Gemini)</strong> 军师规划与文案润色 · <strong>Claude</strong> 高审美视觉编排与复审 · <strong>Codex (GPT)</strong> 硬核后端与两级分级审查。所有交接通过三份规则文件与 <code>docs/</code> 闭环。</p>
          <button id="btnEmptyNew" class="btn btn-primary">+ 初始化第一个项目</button>
        </div>
      </div>

      <div id="projectView" class="project-view hidden">
        <header class="topbar">
          <div>
            <div class="title-row">
              <h1 id="projName"></h1>
              <span id="freezeBadge" class="badge">契约草案</span>
            </div>
            <div id="projPath" class="mono-path"></div>
          </div>
          <div class="topbar-actions">
            <button id="btnRefresh" class="btn">刷新磁盘</button>
            <button id="btnOpenFolder" class="btn">打开目录</button>
            <button id="btnToggleFreeze" class="btn btn-amber">冻结接口契约</button>
            <button id="btnRemoveProj" class="btn btn-danger-ghost" title="仅从列表移除，不删文件">移除</button>
          </div>
        </header>

        <section class="pipeline-card">
          <div class="card-head">
            <span>5 阶段协作管线（点击切换当前阶段，勾选表示门禁通过）</span>
            <span id="taskProgressText" class="muted">任务进度 0/0</span>
          </div>
          <div id="stagePipeline" class="pipeline"></div>
        </section>

        <div class="main-grid">
          <section class="panel">
            <div class="card-head">
              <span>一键交接口令</span>
              <select id="milestoneSelect" class="select-sm"></select>
            </div>
            <div class="agent-switch">
              <button class="agent-pill active" data-agent="codex">Codex 客户端</button>
              <button class="agent-pill pill-claude" data-agent="claude">Claude 客户端</button>
              <button class="agent-pill pill-agy" data-agent="antigravity">Antigravity</button>
            </div>
            <div id="promptSubTabs" class="prompt-tabs"></div>
            <textarea id="promptBox" class="prompt-box" readonly></textarea>
            <div class="panel-foot">
              <span id="promptHint" class="muted">选择目标客户端与阶段后一键复制</span>
              <button id="btnCopyPrompt" class="btn btn-primary">复制口令</button>
            </div>

            <div class="divider"></div>
            <div class="card-head">
              <span>Milestone 切片进度（解析自 docs/04-tasks.md）</span>
            </div>
            <div id="milestoneList" class="milestone-list"></div>
          </section>

          <section class="panel doc-panel">
            <div class="card-head">
              <span>交接文档 SSOT（实时读写）</span>
              <div class="inline-actions">
                <span id="docStatus" class="muted">已同步</span>
                <button id="btnSaveDoc" class="btn btn-primary btn-sm">保存文档</button>
              </div>
            </div>
            <div id="docTabs" class="doc-tabs"></div>
            <textarea id="docEditor" class="doc-editor" spellcheck="false"></textarea>
          </section>
        </div>
      </div>
    </main>
  </div>

  <div id="modalBackdrop" class="modal-backdrop hidden">
    <div class="modal">
      <div class="modal-head">
        <h3>新建或导入协作项目</h3>
        <button id="btnCloseModal" class="btn-link">✕</button>
      </div>
      <label class="field">
        <span>项目目录（本地路径）</span>
        <div class="input-row">
          <input id="inputDir" type="text" placeholder="例如 F:\MyNextApp" />
          <button id="btnPickFolder" class="btn" type="button">浏览…</button>
        </div>
      </label>
      <label class="field">
        <span>项目名称（留空默认取文件夹名）</span>
        <input id="inputName" type="text" placeholder="例如 SnowNote" />
      </label>
      <label class="checkbox-row">
        <input id="inputScaffold" type="checkbox" checked />
        <span>自动初始化 <code>AGENTS.md</code> / <code>CLAUDE.md</code> / <code>GEMINI.md</code> 与 <code>docs/01~05</code> 骨架</span>
      </label>
      <div class="modal-actions">
        <button id="btnCancelModal" class="btn">取消</button>
        <button id="btnConfirmModal" class="btn btn-primary">确认添加</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
